<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니 ERP</title>
<!-- 개발용: 파일 분리. build.js가 단일 HTML로 번들한다. -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- 왼쪽 사이드바 -->
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-logo">📊</span>
      <span class="brand-text">미니 ERP<small>무료 업무 관리</small></span>
    </div>
    <nav id="nav-menu"></nav>
    <div class="sidebar-footer">오픈소스 · MIT · v1.0</div>
  </aside>

  <!-- 오른쪽 메인 -->
  <div id="main">
    <!-- 상단 헤더 바 -->
    <header id="topbar">
      <div class="topbar-left">
        <span class="crumb-root">미니 ERP</span>
        <span class="crumb-sep">›</span>
        <span id="topbar-title">대시보드</span>
        <span id="readonly-badge" style="display:none">📖 읽기 전용 조회</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-sm no-print" id="btn-popout" title="현재 화면을 새 창으로 열기 (두 화면 동시에 보기)">🗗 새 창</button>
        <span id="topbar-company" class="topbar-chip" style="display:none"></span>
        <span id="topbar-date" class="topbar-chip"></span>
        <span id="save-status" class="save-status">준비 중…</span>
      </div>
    </header>
    <div id="app-banner"></div>
    <main id="content"></main>
  </div>
</div>

<!-- 모바일 햄버거 버튼 -->
<button id="menu-toggle" class="no-print" aria-label="메뉴">☰</button>

<!-- 토스트 메시지 영역 -->
<div id="toast-wrap"></div>

<!-- 차트 툴팁 -->
<div id="chart-tooltip"></div>

<!-- 인쇄 전용 영역 -->
<div id="print-root"></div>

<!-- 스크립트 (의존 순서대로) -->
<script src="js/utils.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/state.js"></script>
<script src="js/storage.js"></script>
<script src="js/registry.js"></script>
<script src="js/modules/dashboard.js"></script>
<script src="js/modules/partners.js"></script>
<script src="js/modules/inventory.js"></script>
<script src="js/modules/sales.js"></script>
<script src="js/modules/purchases.js"></script>
<script src="js/modules/shipping.js"></script>
<script src="js/modules/payments.js"></script>
<script src="js/modules/documents.js"></script>
<script src="js/modules/ledger.js"></script>
<script src="js/modules/reports.js"></script>
<script src="js/modules/expenses.js"></script>
<script src="js/modules/receipts.js"></script>
<script src="js/modules/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
